<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3554"><title>أخبار وإعلانات المستشفى</title><link rel="icon" href="./icon.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f6f8;font-family:Tahoma,Arial;color:#183348}header{background:#0b3554;color:white;padding:18px;display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;border-radius:50%;background:white}.wrap{max-width:850px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #e1e9ee;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#718493;font-size:13px;line-height:1.8}.tag{color:#12618c;font-size:12px}a{color:inherit;text-decoration:none}</style></head><body><header><img src="./icon.svg"><div><b>مستشفى الحيدرية العام</b><div class="muted" style="color:#cbd9e1">الأخبار والإعلانات الرسمية</div></div></header><div class="wrap"><p><a href="./">← العودة إلى المساعد الحيدري</a></p><h2>آخر الأخبار والإعلانات</h2><div id="feed" class="muted">جارٍ تحميل الأخبار...</div></div><script>const db=window.supabase.createClient("https://dwffkopuisuyqpgedowp.supabase.co","sb_publishable_2wT5I3b3mY1IPzbFN5NllQ_Ja136LJn");async function load(){const {data,error}=await db.from("hospital_announcements").select("title,body,category,published_at,created_at").eq("is_published",true).order("published_at",{ascending:false}).limit(50);const el=document.getElementById("feed");if(error){el.textContent="تعذر تحميل الأخبار حالياً.";return;}if(!data.length){el.textContent="لا توجد إعلانات منشورة حالياً.";return;}el.innerHTML=data.map(x=>"<article class=card><div class=tag>"+String(x.category||"").replace(/[<>]/g,"")+"</div><h3>"+String(x.title||"").replace(/[<>]/g,"")+"</h3><p style=white-space:pre-wrap;line-height:1.9>"+String(x.body||"").replace(/[<>]/g,"")+"</p><div class=muted>"+new Date(x.published_at||x.created_at).toLocaleDateString("ar-IQ")+"</div></article>").join("");}load();</script></body></html>
